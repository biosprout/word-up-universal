<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WORD UP! 英単語トレーニング</title>
<meta name="description" content="中学レベルから英検準1級レベルまで、7,972語の英単語を学べるアプリ。広告・登録・データ収集なし。">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3D2FB8">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WORD UP!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F4FB;--panel:#FFFFFF;--primary:#3D2FB8;--primary-light:#6B5CE7;
    --accent:#FF8A3D;--success:#18C29C;--danger:#FF5A6E;
    --text:#1A1A2E;--sub:#7A7A94;--border:#E9E9F4;
    --shadow:0 8px 28px rgba(61,47,184,.10);--shadow-sm:0 4px 14px rgba(61,47,184,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--text);
    background:linear-gradient(160deg,#EEEcFB 0%,#F4F4FB 40%,#F0F6FB 100%);
    min-height:100dvh;display:flex;justify-content:center;}
  .app{width:100%;max-width:480px;min-height:100dvh;background:var(--bg);
    display:flex;flex-direction:column;position:relative;box-shadow:0 0 50px rgba(61,47,184,.06);}
  .topbar{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 70%,rgba(244,244,251,0));}
  .brand{display:flex;flex-direction:column;line-height:1.05}
  .brand .logo{font-family:'Poppins';font-weight:800;font-size:24px;letter-spacing:-.5px;color:var(--primary)}
  .brand .logo span{color:var(--accent)}
  .brand .sub{font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}

  .bknote{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;margin-bottom:14px}
  .bknote p{font-size:12px;color:var(--sub);font-weight:600;line-height:1.75;margin-bottom:9px}
  .bknote p b{color:var(--text);font-weight:800;font-size:12.5px}

  .tkq{background:var(--panel);border:1.5px solid var(--border);border-radius:16px;
    padding:16px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
  .tkqrow{display:flex;align-items:flex-start;gap:10px}
  .tkqrow span{flex:1;font-size:17px;font-weight:800;line-height:1.55}
  .tkspk{flex:0 0 auto;background:var(--bg);border:1px solid var(--border);border-radius:10px;
    width:34px;height:34px;font-size:15px;cursor:pointer}
  .tkspk.sm{width:26px;height:26px;font-size:12px;vertical-align:middle;margin-left:4px}
  .tkans{min-height:56px;border:2px dashed var(--border);border-radius:14px;padding:9px;
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg)}
  .tkans.ok{border-style:solid;border-color:var(--primary);background:#EAF7F0}
  .tkans.near{border-style:solid;border-color:var(--accent);background:#FFF6E6}
  .tkans.ng{border-style:solid;border-color:var(--danger);background:#FDECEE}
  .tkempty{font-size:12px;color:var(--sub);font-weight:600;padding:0 4px}
  .tkslot{background:var(--panel);border:1.5px solid var(--primary);border-radius:10px;
    padding:8px 11px;font-size:15px;font-weight:800;font-family:inherit;color:var(--text);cursor:pointer}
  .tkfill{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;
    padding:16px 15px;font-size:16px;font-weight:700;line-height:2.1}
  .tkinput{width:6.5em;font-family:inherit;font-size:16px;font-weight:800;color:var(--primary);
    text-align:center;border:none;border-bottom:2.5px solid var(--primary);background:transparent;
    padding:2px 4px;margin:0 3px}
  .tkinput:focus{outline:none;border-bottom-color:var(--accent)}
  .tkinput:disabled{color:var(--sub);border-bottom-color:var(--border)}
  .tkbank{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .tkw{background:var(--panel);border:1.5px solid var(--border);border-radius:10px;
    padding:9px 12px;font-size:15px;font-weight:700;font-family:inherit;color:var(--text);cursor:pointer}
  .tkw:active{transform:scale(.95)}
  .tkw.used{opacity:.28;cursor:default}

  .helpbtn{background:var(--panel);border:1px solid var(--border);border-radius:999px;
    width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:var(--accent);cursor:pointer;margin-right:8px}
  .helpbtn:active{transform:scale(.94)}
  .topbar .right{display:flex;align-items:center}
  .grp-pill{background:var(--panel);border:1px solid var(--border);border-radius:999px;
    padding:7px 14px;font-size:12px;font-weight:700;color:var(--primary);box-shadow:var(--shadow-sm);
    max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .screen{flex:1;overflow-y:auto;padding:6px 20px 40px;-webkit-overflow-scrolling:touch}
  .hide{display:none!important}
  .ring-card{background:var(--panel);border-radius:24px;padding:24px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:20px;margin-bottom:18px;}
  .ring{position:relative;width:104px;height:104px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct b{font-family:'Poppins';font-size:26px;font-weight:800;color:var(--primary);line-height:1}
  .ring .pct small{font-size:10px;color:var(--sub);font-weight:600;margin-top:2px}
  .ring-info h2{font-size:15px;font-weight:900;margin-bottom:8px}
  .ring-info .stat{display:flex;gap:14px}
  .ring-info .stat div{font-size:11px;color:var(--sub);font-weight:600}
  .ring-info .stat b{display:block;font-family:'Poppins';font-size:20px;color:var(--text);font-weight:700}
  .section-label{font-size:12px;font-weight:800;color:var(--sub);margin:6px 2px 10px;letter-spacing:.3px}
  .grp-scroll{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
  .grp-scroll::-webkit-scrollbar{display:none}
  .grp-chip{flex:0 0 auto;background:var(--panel);border:1.5px solid var(--border);border-radius:14px;
    padding:10px 15px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;transition:.15s;white-space:nowrap;}
  .grp-chip small{display:block;font-size:10px;color:var(--sub);font-weight:600;margin-top:1px}
  .grp-chip.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}
  .grp-chip.on small{color:rgba(255,255,255,.8)}
  .lv-chip{flex:0 0 auto;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:800;color:var(--text);cursor:pointer;transition:.15s}
  .lv-chip.on{background:var(--accent);border-color:var(--accent);color:#2A1D00}
  .grp-chip.weak{border-color:var(--danger);color:var(--danger)}
  .grp-chip.weak.on{background:var(--danger);border-color:var(--danger);color:#fff}
  .grp-chip.weak.on small{color:rgba(255,255,255,.85)}
  .daily{display:flex;align-items:center;gap:13px;border-radius:22px;padding:16px 18px;margin-bottom:16px;cursor:pointer;
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);color:#fff;box-shadow:var(--shadow);transition:.15s}
  .daily:active{transform:scale(.985)}
  .daily.done{background:linear-gradient(135deg,#12A98A 0%,#3BB273 100%)}
  .daily .dic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;font-size:23px;flex:0 0 auto}
  .daily .dbd{flex:1;min-width:0}
  .daily .dbd h3{font-size:16px;font-weight:900;letter-spacing:.2px;line-height:1.3}
  .daily .dbd p{font-size:11px;font-weight:600;opacity:.88;margin-top:3px;line-height:1.45}
  .daily .dbar{height:5px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:8px;overflow:hidden}
  .daily .dbar i{display:block;height:100%;background:#fff;border-radius:99px}
  .daily .dgo{font-family:'Poppins';font-size:12px;font-weight:800;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:999px;flex:0 0 auto;white-space:nowrap}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
  .mode{background:var(--panel);border-radius:20px;padding:20px 16px;cursor:pointer;
    box-shadow:var(--shadow-sm);border:1.5px solid transparent;transition:.15s;display:flex;flex-direction:column;gap:8px;}
  .mode:active{transform:scale(.97)}
  .mode .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px}
  .mode h3{font-size:15px;font-weight:900}
  .mode p{font-size:11px;color:var(--sub);font-weight:500;line-height:1.4}
  .mode.flash .ic{background:#EAE7FB}
  .mode.quiz .ic{background:#FFE9DB}
  .mode.game .ic{background:#DEF7F0}
  .mode.spell .ic{background:#E3F0FF}
  .mode.listen .ic{background:#FFF3D6}
  .a2h>div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:8px}
  .a2h span{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-family:Poppins;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .a2h p{font-size:13px;line-height:1.6;margin:1px 0 0}
  .ob-feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .ob-feat>div{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 12px}
  .ob-feat span{font-size:18px;display:block;margin-bottom:4px}
  .ob-feat b{display:block;font-size:12.5px;font-weight:800;line-height:1.4}
  .ob-feat i{display:block;font-style:normal;font-size:10.5px;color:var(--sub);font-weight:600;line-height:1.5;margin-top:3px}
  .ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ob-item{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:16px;text-align:center;font-weight:800;font-size:15px;cursor:pointer;transition:.15s}
  .ob-item:active{transform:scale(.97);border-color:var(--primary)}
    .lvstat{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .lvstat:last-of-type{margin-bottom:0}
  .lvstat .ln{font-size:10px;font-weight:800;width:64px;flex:0 0 auto}
  .lvstat .lb{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
  .lvstat .lb i{display:block;height:100%;border-radius:99px}
  .lvstat .lnum{font-family:'Poppins';font-size:10px;font-weight:700;color:var(--sub);width:62px;text-align:right;flex:0 0 auto}
  .lvstat .lrate{font-family:'Poppins';font-size:10px;font-weight:800;width:34px;text-align:right;flex:0 0 auto;color:var(--text)}
  .ln.lvc-m1,.lb i.lvc-m1{color:#3BB273;background:#3BB273}
  .ln.lvc-m2,.lb i.lvc-m2{color:#2E9E8F;background:#2E9E8F}
  .ln.lvc-m3,.lb i.lvc-m3{color:#3B82C4;background:#3B82C4}
  .ln.lvc-p2,.lb i.lvc-p2{color:#7B6BD9;background:#7B6BD9}
  .ln.lvc-e2,.lb i.lvc-e2{color:#C9702F;background:#C9702F}
  .ln.lvc-p1,.lb i.lvc-p1{color:#C4456B;background:#C4456B}
  .ln.lvc-m1,.ln.lvc-m2,.ln.lvc-m3,.ln.lvc-p2,.ln.lvc-e2,.ln.lvc-p1{background:none}
    .tlist{display:flex;flex-direction:column;gap:6px}
  .trow{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:10px 12px}
  .trow.lock{opacity:.45}
  .trow.next{border-color:var(--accent);background:#FFF9EF}
  .trow.now{border-color:var(--primary);background:#F0F3FF}
  .tlv{font-family:'Poppins';font-size:10px;font-weight:800;color:var(--sub);width:38px;flex:0 0 auto}
  .tem{font-size:19px;flex:0 0 auto;width:24px;text-align:center}
  .tbd{flex:1;min-width:0}
  .tnm{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;line-height:1.3}
  .tsub{font-size:10px;color:var(--sub);font-weight:600;margin-top:2px}
  .tchk{font-size:14px;font-weight:800;color:var(--primary);flex:0 0 auto}
  .tnow{font-family:'Poppins';font-size:9px;font-weight:800;background:var(--primary);color:#fff;padding:3px 7px;border-radius:6px;flex:0 0 auto}
  .hsec{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:12px}
  .hsec h3{font-size:14px;font-weight:900;margin-bottom:8px;color:var(--primary)}
  .hsec p{font-size:13px;line-height:1.75;margin-bottom:8px}
  .hsec p:last-child{margin-bottom:0}
  .hlist{margin:0 0 8px 18px;padding:0}
  .hlist li{font-size:13px;line-height:1.7;margin-bottom:4px}
  .hnote{font-size:11px!important;color:var(--sub);line-height:1.7!important;border-left:2px solid var(--border);padding-left:10px;margin-top:10px}
  .hpre{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:Poppins,monospace;font-size:12px;line-height:1.8;white-space:pre-wrap;margin-bottom:8px}
  .hpre.lic{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.5px;line-height:1.65;white-space:pre;overflow-x:auto}
  .zkr{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;opacity:.5}
  .zkr.got{opacity:1}
  .zke{font-size:24px;flex:0 0 auto}
  .zkb{flex:1}
  .zkn{font-size:13px;font-weight:900;font-family:'Poppins',sans-serif}
  .zkd{font-size:11px;color:var(--sub);font-weight:600;line-height:1.6;margin-top:4px}
  .zktag{font-size:8px;padding:2px 7px;border-radius:6px;font-weight:800;vertical-align:2px;font-family:'Noto Sans JP'}
  .dupn{font-family:Poppins;font-size:10px;font-weight:800;color:var(--accent);margin-left:2px}
  .zktag.N{background:#EEF1F4;color:#8A94A0}
  .zktag.R{background:#E3F0FF;color:#2E7BC4}
  .zktag.SR{background:#FFF1DC;color:#C9702F}
  .zktag.H{background:#EAE6FF;color:#5B49C4}
  .ach-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .achb{background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:9px 8px;opacity:.55}
  .achb.got{opacity:1;border-color:var(--accent);background:#FFF8EE}
  .achb .an{font-family:'Poppins',sans-serif;font-size:10px;font-weight:700;line-height:1.3;letter-spacing:.1px}
  .achb .ad{font-size:8px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.3}
  .combo-tag{font-family:'Poppins';font-weight:800;font-size:13px;color:var(--accent)}
  .manage-btn{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--border);
    border-radius:18px;padding:16px 18px;margin-top:12px;cursor:pointer;box-shadow:var(--shadow-sm);transition:.15s}
  .manage-btn:active{transform:scale(.98)}
  .manage-btn .ic{width:40px;height:40px;border-radius:12px;background:#FDE4E8;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
  .manage-btn h3{font-size:14px;font-weight:900}
  .manage-btn p{font-size:11px;color:var(--sub);font-weight:500}
  .btn{border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:15px;padding:15px;cursor:pointer;transition:.15s;width:100%;}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}
  .btn-ghost{background:var(--panel);color:var(--primary);border:1.5px solid var(--border)}
  .btn-accent{background:var(--accent);color:#fff}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);
    font-weight:700;font-size:14px;cursor:pointer;padding:6px 2px;margin-bottom:8px;font-family:inherit;}
  .mode-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .mode-head h2{font-size:18px;font-weight:900}
  .progress-line{height:6px;background:var(--border);border-radius:999px;overflow:hidden;margin-bottom:18px}
  .progress-line i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
  .flash-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
  .card{width:100%;aspect-ratio:3/2;background:var(--panel);border-radius:24px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;
    position:relative;padding:20px;text-align:center;transition:.2s;}
  .card:active{transform:scale(.98)}
  .card .tag{position:absolute;top:14px;left:16px;font-size:10px;font-weight:800;color:var(--sub);letter-spacing:.5px}
  .card .tap-hint{position:absolute;bottom:14px;font-size:11px;color:var(--sub);font-weight:600}
  .card .en{font-family:'Poppins';font-size:40px;font-weight:700;color:var(--primary);word-break:break-word}
  .card .ja{font-size:28px;font-weight:700;color:var(--text)}
  .card.learned-mark::after{content:'✓ 覚えた';position:absolute;top:13px;right:14px;font-size:10px;font-weight:800;color:var(--success)}
  .flash-nav{display:flex;gap:10px;width:100%}
  .flash-nav .btn{flex:1}
  .flash-mark{display:flex;gap:10px;width:100%}
  .counter{font-family:'Poppins';font-weight:700;color:var(--sub);font-size:14px}
  .toggle-row{display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
  .seg{display:inline-flex;background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:3px;gap:2px}
  .seg button{border:none;background:none;font-family:inherit;font-weight:700;font-size:12px;color:var(--sub);padding:7px 12px;border-radius:9px;cursor:pointer}
  .seg button.on{background:var(--primary);color:#fff}
  .q-card{background:var(--panel);border-radius:22px;padding:30px 20px;box-shadow:var(--shadow);text-align:center;margin-bottom:16px}
  .q-card .qlabel{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.5px;margin-bottom:12px}
  .q-card .qword{font-family:'Poppins';font-size:36px;font-weight:700;color:var(--primary);word-break:break-word}
  .q-card .qword.ja{font-family:'Noto Sans JP';color:var(--text);font-size:28px}
  .choices{display:grid;gap:10px}
  .choice{background:var(--panel);border:1.5px solid var(--border);border-radius:15px;padding:16px;
    font-family:inherit;font-size:16px;font-weight:700;color:var(--text);cursor:pointer;text-align:left;transition:.12s;}
  .choice:active{transform:scale(.99)}
  .choice.correct{background:var(--success);border-color:var(--success);color:#fff}
  .choice.wrong{background:var(--danger);border-color:var(--danger);color:#fff}
  .choice.dim{opacity:.45}
  .quiz-score{font-family:'Poppins';font-weight:700;color:var(--sub);font-size:14px}
  .result{text-align:center;padding:30px 10px}
  .result .big{font-family:'Poppins';font-size:60px;font-weight:800;color:var(--primary);line-height:1}
  .result .emoji{font-size:54px;margin-bottom:6px}
  .result h2{font-size:20px;font-weight:900;margin:10px 0 4px}
  .result p{color:var(--sub);font-weight:600;font-size:13px;margin-bottom:20px}
  .miss-list{text-align:left;background:var(--panel);border-radius:16px;padding:6px 4px;box-shadow:var(--shadow-sm);margin-bottom:18px;max-height:220px;overflow-y:auto}
  .miss-list .row{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);font-size:14px}
  .miss-list .row:last-child{border:none}
  .miss-list .row b{font-family:'Poppins';color:var(--primary);font-weight:700}
  .miss-list .row span{color:var(--sub);font-weight:600}
  .game-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-family:'Poppins';font-weight:700}
  .game-top .timer{font-size:22px;color:var(--primary)}
  .game-top .left{font-size:13px;color:var(--sub)}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tile{background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:16px 8px;min-height:62px;
    display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-weight:700;font-size:15px;transition:.12s;line-height:1.2;}

  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .add-box{background:var(--panel);border-radius:18px;padding:16px;box-shadow:var(--shadow-sm);margin-bottom:16px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:11px;font-weight:800;color:var(--sub);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;border:1.5px solid var(--border);border-radius:11px;padding:11px 13px;
    font-family:inherit;font-size:14px;color:var(--text);background:#FCFCFE;}
  .field textarea{resize:vertical;min-height:90px;line-height:1.5}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary-light)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tabs{display:flex;gap:6px;background:var(--panel);border:1.5px solid var(--border);border-radius:13px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;border:none;background:none;font-family:inherit;font-weight:800;font-size:13px;color:var(--sub);padding:9px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:var(--primary);color:#fff}
  .word-list{display:flex;flex-direction:column;gap:8px}
  .word-row{background:var(--panel);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow-sm);
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .word-row .w-en{font-family:'Poppins';font-weight:700;color:var(--primary);font-size:15px}
  .word-row .w-ja{font-size:13px;color:var(--text);font-weight:600}
  .word-row .w-grp{font-size:10px;color:var(--sub);font-weight:700;margin-top:2px}
  .word-row .ops{display:flex;gap:6px;flex:0 0 auto}
  .iconbtn{border:none;background:#F2F2FA;border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:14px;color:var(--sub)}
  .iconbtn.del:active{background:var(--danger);color:#fff}
  .empty{text-align:center;color:var(--sub);font-weight:600;font-size:13px;padding:40px 20px;line-height:1.6}
  .help{font-size:11px;color:var(--sub);line-height:1.6;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;
    padding:12px 22px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .pop{position:fixed;inset:0;pointer-events:none;z-index:40;display:flex;align-items:center;justify-content:center}
  .pop span{position:absolute;font-size:24px;animation:fly .8s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">WORD <span>UP!</span></div><div class="sub" id="brandSub">中学〜準1級レベル</div></div>
    <button class="helpbtn" onclick="renderHelp()" aria-label="使い方">？</button><div class="grp-pill" id="grpPill">全部</div>
  </div>
  <div id="updBar" style="display:none;align-items:center;gap:10px;background:var(--accent);color:#3A1B00;padding:10px 14px;border-radius:12px;margin:0 0 12px;font-size:13px;font-weight:800">
    <b style="flex:1">新しいバージョンがあります</b>
    <button onclick="forceUpdate()" style="background:#3A1B00;color:var(--accent);border:0;border-radius:8px;padding:7px 12px;font-weight:800;font-size:12px">更新する</button>
  </div>
  <div class="screen" id="screen"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const STORE_KEY='wordup_universal_v1';
let mem=null;
const DATA_DIR='data/';
function wid(g,en){return g+'|'+en.toLowerCase();}
function pkey(en){return en.toLowerCase();}
function w(en,ja,g){return {id:wid(g,en),en,ja,groupId:g,learned:false,correct:0,wrong:0,own:true};}
let META=null;
const LOADED={};


const LEVELS=[];

function load(){
  const base={xp:0,maxCombo:0,ach:[],cards:[],best:{},streak:{day:'',count:0},
    progress:{},myWords:[],myGroups:[],words:[],groups:[],level:'m1',onboarded:false,daily:null};
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const st=JSON.parse(raw);
      // 旧形式（単語まるごと保存）からの移行
      if(Array.isArray(st.words)&&st.words.length&&!st.progress){
        st.progress={};
        st.myWords=[];
        st.words.forEach(x=>{
          if(x.own){st.myWords.push(x);return;}
          if(x.correct||x.wrong||x.learned){
            const k=x.en.toLowerCase(),v=[x.correct|0,x.wrong|0,x.learned?1:0],o=st.progress[k];
            st.progress[k]=o?[Math.max(o[0],v[0]),Math.max(o[1],v[1]),Math.max(o[2],v[2])]:v;
          }
        });
        st.myGroups=(st.groups||[]).filter(g=>g.lv==='my'&&g.id!=='my1'&&g.id!=='my2');
      }
      return Object.assign(base,st,{words:[],groups:[]});
    }
  }catch(e){}
  return base;
}
function save(){
  try{
    // 単語の読み込み前に save() が走ることがある。そのときは
    // 空の state.words から進捗やマイ単語を作り直してしまわないようにする
    if(state.words.length){
    const pr={};
    state.words.forEach(x=>{
      if(x.own)return;
      const k=pkey(x.en),v=[x.correct|0,x.wrong|0,x.learned?1:0,x.seen|0,x.wrongDay|0],o=pr[k];
      if(!v[0]&&!v[1]&&!v[2]&&!v[3])return;
      const m=o?[Math.max(o[0],v[0]),Math.max(o[1],v[1]),Math.max(o[2],v[2]),
                 Math.max(o[3]|0,v[3]),Math.max(o[4]|0,v[4])]:v.slice();
      while(m.length>3&&!m[m.length-1])m.pop();   // 古い形式と同じ長さに保つ
      pr[k]=m;
    });
    state.progress=Object.assign({},state.progress,pr);
    state.myWords=state.words.filter(x=>x.own);
    }
    const out={xp:state.xp,maxCombo:state.maxCombo,ach:state.ach,cards:state.cards,cardCount:state.cardCount,best:state.best,
      streak:state.streak,tickets:state.tickets,ticketLabel:state.ticketLabel,level:state.level,
      onboarded:state.onboarded,progress:state.progress,myWords:state.myWords,myGroups:state.myGroups,
      stat:state.stat,daily:state.daily,sound:state.sound,tstat:state.tstat,talkDone:state.talkDone,talkMd:state.talkMd};
    localStorage.setItem(STORE_KEY,JSON.stringify(out));
  }catch(e){ mem=state; }
}
let state=load();
let currentGroup='all';
let quizCount=10;
if(!state.level)state.level='m1';
let curLevel=state.level;
function applyProgress(x){
  const p=state.progress[pkey(x.en)];
  // [正解数, 誤答数, 学習済み, 最後に出会った日, 最後にまちがえた日]（4番目以降は無くてもよい）
  if(p){x.correct=p[0]|0;x.wrong=p[1]|0;x.learned=!!p[2];
    if(p[3])x.seen=p[3]|0; if(p[4])x.wrongDay=p[4]|0;}
  return x;
}
async function ensureLevel(lv){
  if(lv==='all'){ for(const l of META.levels) await ensureLevel(l.id); return; }
  if(lv==='my'||LOADED[lv])return;
  const meta=META.levels.find(l=>l.id===lv);
  if(!meta){LOADED[lv]=true;return;}
  const doc=await (await fetch(DATA_DIR+meta.file,{cache:'no-cache'})).json();
  doc.groups.forEach(g=>{
    state.groups.push({id:g.id,name:g.name,lv:lv});
    g.w.forEach(([en,ja])=>state.words.push(applyProgress(
      {id:wid(g.id,en),en,ja,groupId:g.id,learned:false,correct:0,wrong:0})));
  });
  LOADED[lv]=true;
}
function bootGroups(){
  state.groups.push({id:'my1',name:'マイ単語帳 1',lv:'my'});
  state.groups.push({id:'my2',name:'マイ単語帳 2',lv:'my'});
  (state.myGroups||[]).forEach(g=>state.groups.push(g));
  (state.myWords||[]).forEach(x=>state.words.push(x));
}
function loadingScreen(msg){
  screen.innerHTML=`<div class="ring-card" style="flex-direction:column;text-align:center;gap:10px;margin-top:40px">
    <div style="font-size:34px">📚</div>
    <div style="font-weight:800;font-size:15px">${msg||'単語データを読み込み中...'}</div>
    <div class="progress-line" style="width:100%"><i style="width:60%"></i></div></div>`;
}
async function boot(){
  loadingScreen();
  try{
    META=await (await fetch(DATA_DIR+'index.json',{cache:'no-cache'})).json();
  }catch(e){
    screen.innerHTML=`<div class="ring-card" style="flex-direction:column;text-align:center;gap:10px;margin-top:40px">
      <div style="font-size:34px">⚠️</div><div style="font-weight:800">単語データを読み込めませんでした</div>
      <p class="help">このアプリは data フォルダと同じ場所に置いて、Webサーバー（GitHub Pages など）経由で開いてください。ファイルを直接ダブルクリックして開くと読み込めません。</p></div>`;
    return;
  }
  const sub=document.getElementById('brandSub');
  if(sub)sub.textContent='中学〜準1級レベル / '+META.total.toLocaleString()+'語';
  LEVELS.length=0;
  META.levels.forEach(l=>LEVELS.push({id:l.id,name:l.name}));
  LEVELS.push({id:'my',name:'マイ単語帳'});
  bootGroups();
  if(!META.levels.find(l=>l.id===curLevel))curLevel=state.level=META.levels[0].id;
  await ensureLevel(curLevel);
  if(state.onboarded)renderHome(); else renderOnboard();
  // 残りは背景で読み込む
  for(const l of META.levels){ if(!LOADED[l.id]){ try{await ensureLevel(l.id);}catch(e){} } }
  if(state.onboarded&&document.querySelector('.ring-card'))renderHome();
}
function xpAtLevel(l){let a=0;for(let i=1;i<l;i++)a+=xpNeed(i);return a;}
function renderTitles(){
  const cur=lvlInfo(state.xp).level;
  const rows=TITLES.map((t,i)=>{
    const l=i+1;
    if(l<=cur){
      const now=l===cur;
      return `<div class="trow got ${now?'now':''}">
        <span class="tlv">Lv.${l}</span>
        <span class="tem">${t.e}</span>
        <div class="tbd"><div class="tnm">${t.n}</div>
          <div class="tsub">${now?'いまの称号':'到達済み'}</div></div>
        ${now?'<span class="tnow">NOW</span>':'<span class="tchk">✓</span>'}</div>`;
    }
    if(l===cur+1){
      const rest=xpAtLevel(l)-state.xp;
      return `<div class="trow next">
        <span class="tlv">Lv.${l}</span>
        <span class="tem">🔒</span>
        <div class="tbd"><div class="tnm" style="color:var(--sub)">？？？</div>
          <div class="tsub">あと ${rest.toLocaleString()} XP で判明</div></div>
        <span class="tchk" style="color:var(--accent)">→</span></div>`;
    }
    return `<div class="trow lock">
      <span class="tlv">Lv.${l}</span>
      <span class="tem">🔒</span>
      <div class="tbd"><div class="tnm" style="color:var(--sub)">？？？</div>
        <div class="tsub">Lv.${l} で判明</div></div></div>`;
  }).join('');
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ 戻る</button>
    <div class="mode-head"><h2>🎖 称号の記録</h2><span class="quiz-score">${cur}/${TITLES.length}</span></div>
    <div class="ring-card" style="flex-direction:column;text-align:center;gap:4px;padding:18px">
      <div style="font-size:34px">${titleOf(cur).e}</div>
      <div style="font-family:Poppins,sans-serif;font-size:19px;font-weight:800;color:var(--accent)">${titleOf(cur).n}</div>
      <div style="font-size:12px;color:var(--sub);font-weight:700">Lv.${cur}　累計 ${state.xp.toLocaleString()} XP</div>
    </div>
    <p class="help" style="margin-bottom:10px">レベルが上がるたびに称号が変わります。この先の称号は到達すると分かります。</p>
    <div class="tlist">${rows}</div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="renderHome()">ホームに戻る</button>`;
}
function renderHelp(){
  const sec=(t,body)=>`<div class="hsec"><h3>${t}</h3>${body}</div>`;
  const li=a=>'<ul class="hlist">'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ 戻る</button>
    <div class="mode-head"><h2>❓ 使い方ガイド</h2></div>
    <p class="help" style="margin-bottom:14px">中学レベルから英検準1級レベルまで、${META?META.total.toLocaleString():''}語を収録した英単語アプリです。無料で、広告もアカウント登録もありません。</p>

    ${sec('1. 迷ったら「今日の20語」',
      '<p>ホームのいちばん上にある <b>今日の20語</b> を押すだけで、その日にやるべき20語が自動で出ます。何を選ぶか迷わなくて済むので、まずはここから始めるのがおすすめです。</p>'+
      li(['<b>苦手な語</b> — まちがえてから日が経ったものほど先に出ます',
          '<b>そろそろ忘れそうな語</b> — 正解が続いている語ほど間隔をあけて出します',
          '<b>はじめての語</b> — 毎日少しずつ混ぜます'])+
      '<p>何日休んでも「たまった○○語」のような表示は出ません。いつ開いても20語だけです。まちがえた語は翌日以降に自動でまた出てきます。</p>')}

    ${sec('2. レベルを選ぶ',
      '<p>ホームの「🎓 レベルを選ぶ」から、自分に合ったレベルを選びます。選んだレベルの単語だけが出題されるので、いきなり難しい単語が出て困ることはありません。</p>'+
      li(['<b>中1・中2</b> — 学校の教科書レベル',
          '<b>中3・高校受験</b> — 高校入試と英検3級レベル',
          '<b>準2級・2級レベル</b> — 高校の内容と大学入試',
          '<b>準1級レベル</b> — 大学中級・難関語'])+
      '<p>レベルはいつでも切り替えられます。「すべて」を選べば全レベルから出題されます。</p>')}

    ${sec('3. 質問に答える',
      '<p>英語で聞かれたときに、何をどう返すかの練習です。ホームの <b>💬 質問に答える</b> から。1回${TALK_N}問。</p>'+
      li(['<b>4択</b> — 4つの中から、その質問に合う返し方をえらびます。How often なら回数、Where なら場所、というように、質問の型ごとの返し方が身につきます',
          '<b>書く</b> — 返答の文の空いているところに、自分で単語を打ちこみます',
          '<b>ならべる</b> — 単語のかたまりから必要な語だけをえらんで、返答の文を作ります。使わない語もまざっているので、質問を読まないと解けません'])+
      '<p>上のボタンで、<b>4択</b>・<b>書く</b>・<b>ならべる</b>・ぜんぶ から選べます。</p>'+'<p>ならべた語が合っていて順番だけ違うときは、「おしい」と出ます。まちがえた型ほど、次に先に出てきます。</p>'+
      '<p>質問も答えの例も 🔊 で読み上げられます。</p>')}

    ${sec('4. 学習モードを使い分ける',
      li(['<b>フラッシュカード</b> — カードをめくって意味を確認。最初に単語を眺めるのに向いています',
          '<b>4択クイズ</b> — 意味を選ぶ。覚えたか手早く確認できます',
          '<b>マッチング</b> — 英語と日本語のペアをそろえるゲーム',
          '<b>書いて覚える</b> — 意味を見てつづりを入力。ヒントは押すたびに3段階（文字数 → 頭文字 → 1文字おき）で親切になります。まちがえても「もう一度」で書き直せます',
          '<b>リスニング</b> — 音声だけを聞いて、意味を選ぶか、つづりを書きます',
          '<b>タイムアタック</b> — 60秒で何問正解できるか挑戦'])+
      '<p>まちがえた単語は「⚠️ 苦手だけ」に自動でたまります。テスト前はここを潰すのが効率的です。</p>')}

    ${sec('5. XPとレベル、称号',
      '<p>正解するとXPがたまり、レベルが上がります。レベルは40段階あり、上がるごとに称号が変わります。次に何になるかは、上がってからのお楽しみです。ホームの称号名をタップすると、これまでに獲得した称号の一覧が見られます。</p>'+
      li(['4択クイズ 正解 +10 XP','書いて覚える 正解 +15 XP',
          'リスニング（選ぶ）+12 XP／（書く）+18 XP',
          'マッチング クリア +30 XP','フラッシュカードで「覚えた」+3 XP',
          '3コンボ以上で +5、5コンボ以上で +10 のボーナス']))}

    ${sec('6. ごほうび券',
      '<p>レベルアップ・実績解除・5日連続学習のたびに「ごほうび券」が1枚もらえます。券の内容は保護者の方と決めて、券の画面の「⚙ 券の内容を変更」から自由に書き換えられます。</p>'+
      '<p>使うときは券の画面を保護者に見せてから「使う」を押します。使った履歴が残るので、あとから確認できます。</p>')}

    ${sec('7. 図鑑と実績',
      '<p>「📖 ことばの図鑑」は英単語の語源や由来を集めるコレクションです。レベルアップ・実績解除・5日連続学習のときに、未発見のカードから1枚もらえます。ふつう・レア・超レアがあり、超レアほど出にくくなっています。</p>'+
      '<p>「🏅 実績」は40種類。条件を満たすと自動で解除されます。<b>ここに表示されていない実績や図鑑も存在します。</b>いろいろな遊び方を試してみてください。</p>')}

    ${sec('8. 自分の単語を追加する',
      '<p>「単語を増やす・編集する」から、教科書やテスト範囲の単語を登録できます。「まとめて」タブに次の形式で貼り付ければ、一度に登録できます。</p>'+
      '<pre class="hpre">apple りんご\nimportant 重要な\nachieve 達成する</pre>'+
      '<p>区切りはスペースでもカンマでも構いません。自分で作ったグループは、どのレベルを選んでいるときも表示されます。</p>'+'<p>「保存」タブから、自分で登録した単語をテキストとして書き出せます。メモ帳やメールに貼って保管しておけば、機種変更やデータ消去のときに読み込んで復元できます。</p>')}

    ${sec('9. 音を止めたいとき',
      '<p>今日の20語を終えたとき、レベルが上がったとき、図鑑を手に入れたときに短い音が鳴ります。ホームのいちばん下にある <b>🔔 音あり</b> を押すと止まります。もう一度押すと戻ります。</p>'+

function renderZukan(){
  const have=new Set(CARDS.filter(c=>(state.cardCount||{})[c.id]>0).map(c=>c.id));
  const norm=cardsNormal();
  const got=norm.filter(c=>have.has(c.id)).length;
  const sec=(r,label)=>{
    const cs=CARDS.filter(c=>c.r===r);
    return `<div class="section-label">${label}（${cs.filter(c=>have.has(c.id)).length}/${cs.length}）</div>`+
      cs.map(c=>have.has(c.id)
        ?`<div class="zkr got"><span class="zke">${c.e}</span><div class="zkb"><div class="zkn">${esc(c.n)}${(state.cardCount&&state.cardCount[c.id]>1)?` <span class="dupn">×${state.cardCount[c.id]}</span>`:''} <span class="zktag ${c.r}">${c.r==='SR'?'超レア':c.r==='R'?'レア':'ふつう'}</span></div><div class="zkd">${esc(c.d)}</div></div></div>`
        :`<div class="zkr"><span class="zke">🔒</span><div class="zkb"><div class="zkn" style="color:var(--sub)">？？？</div><div class="zkd">レベルアップ・実績解除・5日連続学習で手に入る</div></div></div>`).join('');
  };
  const hid=CARDS.filter(c=>c.r==='H'&&(state.cardCount||{})[c.id]>0);
  const hidSec=hid.length?`<div class="section-label">🔮 隠し図鑑（${hid.length}）</div>`+
    hid.map(c=>`<div class="zkr got" style="border-color:#7B6BD9;background:#F4F2FF"><span class="zke">${c.e}</span><div class="zkb"><div class="zkn">${esc(c.n)}${(state.cardCount&&state.cardCount[c.id]>1)?` <span class="dupn">×${state.cardCount[c.id]}</span>`:''} <span class="zktag H">隠し</span></div><div class="zkd">${esc(c.d)}</div></div></div>`).join(''):'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ 戻る</button>
    <div class="mode-head"><h2>📖 ことばの図鑑</h2><span class="quiz-score">${got}/${norm.length}</span></div>
    ${got>=norm.length?'<div class="ring-card" style="justify-content:center"><b style="color:var(--accent)">🏆 コンプリート！</b></div>':''}
    <p class="help" style="margin-bottom:10px">英単語の語源や由来の豆知識を集める図鑑。語の背景を知ると記憶に残りやすくなる。</p>
    ${hidSec}
    ${sec('SR','⭐ 超レア')}
    ${sec('R','🔹 レア')}
    ${sec('N','・ ふつう')}`;
}
async function setLevel(l){

  curLevel=l; state.level=l; currentGroup='all'; save(); renderHome();
}

function grantCard(){
  chime('card');
  const cnt=state.cardCount||(state.cardCount={});
  const owned=id=>(cnt[id]||0)>0;
  // 未所持は重み3倍。重複も出るが新規が出やすい
  const W={N:6,R:3,SR:1,H:0};
  const build=arr=>{
    let tot=0; const w=arr.map(c=>{const v=(W[c.r]||1)*(owned(c.id)?1:3); tot+=v; return v;});
    return {arr,w,tot};
  };
  const draw=pool=>{
    const {arr,w,tot}=build(pool);
    let x=Math.random()*tot;
    for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i];}
    return arr[arr.length-1];
  };
  const give=(c,isHidden)=>{
    cnt[c.id]=(cnt[c.id]||0)+1;
    if(!state.cards.includes(c.id))state.cards.push(c.id);
    save();
    const dup=cnt[c.id]>1;
    const msg=isHidden
      ? '🔮 隠し図鑑を発見！ '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':'')
      : '📖 ことばの図鑑に追加: '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':(c.r==='SR'?'（超レア！）':c.r==='R'?'（レア）':''));
    setTimeout(()=>{toast(msg);pop(dup?6:10);},1400);
  };
  const hid=CARDS.filter(c=>c.r==='H');
  const newHid=hid.filter(c=>!owned(c.id));
  if(hid.length&&Math.random()<0.04){
    give(newHid.length?newHid[Math.floor(Math.random()*newHid.length)]
                      :hid[Math.floor(Math.random()*hid.length)],true);
    return;
  }
  const pool=CARDS.filter(c=>c.r!=='H');
  if(!pool.length)return;
  give(draw(pool),false);
}

const MAXLV=40;
function xpNeed(l){return 60*l+4*l*l;}
function lvlInfo(xp){
  let l=1,acc=0,need=xpNeed(1);
  while(l<MAXLV&&xp>=acc+need){acc+=need;l++;need=xpNeed(l);}
  if(l>=MAXLV)return{level:MAXLV,cur:Math.max(0,xp-acc),need:xpNeed(MAXLV),max:true};
  return{level:l,cur:xp-acc,need};
}

/* ===================== 今日の20語 =====================
   間隔反復は「今日やる量」ではなく「出題の優先順位」として使う。
   何日空けても常に20語なので、たまって見えることがない。            */
const DAILY_N=20;
function isNewWord(x){ return !(x.seen|0)&&!(x.correct|0)&&!(x.wrong|0)&&!x.learned; }
// 覚えている度合いに応じた復習間隔（日）
function ivlOf(x){ const s=Math.max(0,Math.min(5,(x.correct|0)-(x.wrong|0)*2)); return [1,2,4,8,16,32][s]; }
function dailyScore(x,today){
  const seen=x.seen|0, wd=x.wrongDay|0;
  let s;
  if(isNewWord(x)) s=40;                                     // まだ見ていない語
  else{
    const el=seen?today-seen:60;                             // 何日ぶりか
    if(isWeak(x)) s=100+Math.min(wd?today-wd:el,30)*2;       // 苦手。まちがえてから日が経つほど上げる
    else{ const due=el-ivlOf(x); s=due>=0?60+Math.min(due,30):15+due; }  // 復習の期限
  }
  if(seen&&seen===today)s-=1000;                             // 今日もう出した語は最後に回す
  return s+Math.random()*6;                                  // 同点はばらけさせる
}
function buildDaily(){
  const all=lvWords();
  if(all.length<4)return [];
  const today=dayNum();
  const scored=all.map(x=>({x:x,s:dailyScore(x,today)})).sort((a,b)=>b.s-a.s);
  const pick=[],used=new Set();
  let nWeak=0,nNew=0;
  for(const it of scored){                                   // 苦手8・新出8を上限に配合する
    if(pick.length>=DAILY_N)break;
    const x=it.x;
    if(isWeak(x)){ if(nWeak>=8)continue; nWeak++; }
    else if(isNewWord(x)){ if(nNew>=8)continue; nNew++; }
    pick.push(x);used.add(x.id);
  }
  for(const it of scored){                                   // 足りなければ上限を外して補充
    if(pick.length>=DAILY_N)break;
    if(!used.has(it.x.id)){pick.push(it.x);used.add(it.x.id);}
  }
  let nowNew=pick.filter(isNewWord).length;                  // 新出は最低4語。毎日すこしずつ前に進む
  if(nowNew<4){
    for(const it of scored){
      if(nowNew>=4)break;
      if(used.has(it.x.id)||!isNewWord(it.x))continue;
      let k=-1;                                              // いちばん優先度の低い「苦手でも新出でもない語」と入れ替える
      for(let j=pick.length-1;j>=0;j--){ if(!isWeak(pick[j])&&!isNewWord(pick[j])){k=j;break;} }
      if(k<0)break;
      used.delete(pick[k].id); pick[k]=it.x; used.add(it.x.id); nowNew++;
    }
  }
  return shuffle(pick).slice(0,DAILY_N);
}
function daily(){
  const t=todayStr();
  const d0=state.daily;
  // まだ1問も解いていないときだけ、レベルの変更で作り直す。
  // 解きはじめたあとにレベルを変えても、その日のぶんの進み具合は残す
  const started=!!d0&&((d0.ok.length+d0.ng.length)>0||d0.fin);
  if(!d0||d0.d!==t||(d0.lv!==curLevel&&!started)){
    const list=buildDaily();
    if(!list.length)return null;
    state.daily={d:t,lv:curLevel,ids:list.map(x=>x.id),ok:[],ng:[],fin:false};
    save();
  }
  return state.daily;
}
function dailyWords(){
  const d=state.daily; if(!d)return [];
  const m=new Map(state.words.map(x=>[x.id,x]));
  return d.ids.map(i=>m.get(i)).filter(Boolean);
}
function dailyCard(){
  const d=daily(); if(!d)return '';
  const tot=d.ids.length,done=d.ok.length+d.ng.length,fin=d.fin||done>=tot;

  let sub,go;                                                // 見出しは状態が変わっても動かさない
  if(fin){ sub='おわり！ '+d.ok.length+'/'+done+' 正解'; go='もう一度'; }   // 連続日数はレベルカード側に出ている
  else if(done>0){ sub='あと '+(tot-done)+' 語'; go='つづき'; }
  else { sub='苦手と新しい語をまぜてあるよ'; go='はじめる'; }
  return `<div class="daily${fin?' done':''}" onclick="startDaily()">
      <div class="dic">${fin?'🎉':'☀️'}</div>
      <div class="dbd"><h3>今日の20語</h3><p>${sub}</p>${
        (done>0&&!fin)?`<div class="dbar"><i style="width:${Math.round(done/tot*100)}%"></i></div>`:''}</div>
      <div class="dgo">${go} ›</div>
    </div>`;
}
function startDaily(){
  const d=daily();
  if(!d){toast('単語を読み込み中です。少し待ってね');return;}
  if(state.words.length<4){toast('単語がまだ足りません');return;}
  const done=new Set(d.ok.concat(d.ng));
  let list=dailyWords().filter(x=>!done.has(x.id));
  if(!list.length)list=dailyWords();          // やり終わっていたら、同じ20語でもう一周（記録は据え置き）
  if(!list.length){toast('単語がまだ足りません');return;}
  markMode('quiz');markLevel(curLevel);
  qz={list:list,i:0,score:0,miss:[],dir:'en',answered:false,combo:0,maxCombo:0,daily:true,
      dirs:list.map(x=>(!isNewWord(x)&&Math.random()<.34)?'ja':'en')};  // 既習語は3回に1回くらい 日→英
  renderQuiz();
}

    if(!window._ac)window._ac=new AC();
    const ac=window._ac;
    if(ac.state==='suspended')ac.resume();
    return ac;
  }catch(e){ return null; }
}
function unlockAudio(){
  const ac=_audio();
  if(!ac||_acReady)return;
  try{
    const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource();
    s.buffer=b; s.connect(ac.destination); s.start(0);
    _acReady=true;
  }catch(e){}
}
['touchend','pointerdown','click','keydown'].forEach(function(ev){
  document.addEventListener(ev, unlockAudio, {passive:true});
});
let _chimeAt=0;
function chime(kind){
  if(!soundOn())return;
  const now=Date.now();
  if(now-_chimeAt<450)return;     // レベルアップと図鑑が同時に来たときの二度鳴りを防ぐ
  _chimeAt=now;
  const ac=_audio();
  if(!ac)return;
  try{
    const seq = kind==='level' ? [[523.25,0],[659.25,.10],[783.99,.20],[1046.50,.30]]
              : kind==='card'  ? [[880.00,0],[1174.66,.09]]
              :                  [[659.25,0],[783.99,.10],[1046.50,.20]];
    const dur = kind==='level'?.42:.30;
    seq.forEach(function(p){
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=p[0];
      const t=ac.currentTime+p[1];
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(.16,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t+dur+.03);
    });
  }catch(e){}
}

/* ===================== 質問に答える =====================
   単語を知っているだけでなく、英語で聞かれたときに返せるようにする練習。
   data/talk.json から読み込む。本体が読めなくてもアプリは動く。 */
let TALK=[], talkLoad='none';
async function loadTalk(){
  if(talkLoad==='ok'||talkLoad==='loading')return;
  talkLoad='loading';
  try{
    const d=await (await fetch(DATA_DIR+'talk.json',{cache:'no-cache'})).json();
    TALK=d.items||[];
    talkLoad=TALK.length?'ok':'fail';
  }catch(e){ talkLoad='fail'; }
}
const TALK_N=8;
function talkNorm(w){ return String(w).toLowerCase().replace(/[.,!?]/g,'').replace(/[’]/g,"'"); }
function talkSame(a,b){
  if(a.length!==b.length)return false;
  for(let i=0;i<a.length;i++) if(talkNorm(a[i])!==talkNorm(b[i]))return false;
  return true;
}
function talkSameSet(a,b){
  if(a.length!==b.length)return false;
  const x=a.map(talkNorm).sort(), y=b.map(talkNorm).sort();
  return x.every((v,i)=>v===y[i]);
}
/* 出題の優先順位。まちがえた型ほど先に出す */
/* 同じ返答文から作った問題をまとめるための見出し。b11f2 → b11 */
function talkSrc(q){ return String(q.id).replace(/f\d*$/,''); }
function talkScore(q,today){
  const st=state.tstat&&state.tstat[q.id];
  if(!st||(st.c+st.w)===0)return 40;
  const el=Math.max(0,st.d?today-st.d:60);
  if(st.w>0&&st.c<=st.w)return 100+Math.min(el,30)*2;
  const k=Math.max(0,Math.min(5,st.c-st.w*2));
  const due=el-[1,2,4,8,16,32][k];
  return due>=0?60+Math.min(due,30):15+due;
}
function talkMd(){ return state.talkMd||'both'; }
function setTalkMd(m){ state.talkMd=m; save(); talkMenu(); }
function talkPool(lv,md){
  return TALK.filter(q=>(lv==='all'||q.lv===lv)&&(md==='both'||q.mode===md));
}
function startTalk(lv,md){
  if(talkLoad!=='ok'){ toast(talkLoad==='loading'?'読み込み中。少し待ってね':'データを読み込めませんでした'); return; }
  md=md||talkMd();
  const pool=talkPool(lv,md);
  if(pool.length<3){ toast('この組み合わせの問題がまだ足りません'); return; }
  const today=dayNum();
  const sc=pool.map(q=>({q:q,s:talkScore(q,today)+Math.random()*6})).sort((a,b)=>b.s-a.s);
  // 同じ返答文から作った問題は、1回の中で1問までにする。
  // b11 / b11f1 / b11f2 はどれも質問が同じなので、続けて出ると読むのが作業になる。
  const used=new Set(), picked=[];
  for(const x of sc){
    const src=talkSrc(x.q);
    if(used.has(src))continue;
    used.add(src); picked.push(x.q);
    if(picked.length>=Math.min(TALK_N,pool.length))break;
  }
  // それでも足りなければ、残りから補う
  if(picked.length<Math.min(TALK_N,pool.length))
    for(const x of sc){ if(picked.includes(x.q))continue; picked.push(x.q);
      if(picked.length>=Math.min(TALK_N,pool.length))break; }
  const list=shuffle(picked);
  tk={list:list,i:0,score:0,miss:[],answered:false,sel:[],typed:'',combo:0,maxCombo:0,
      lv:lv,md:md,ord:talkOrder(list[0]),t0:Date.now()};
  renderTalk();
}
let tk={list:[],i:0,score:0,miss:[],answered:false,sel:[],combo:0,maxCombo:0};
function talkPick(k){
  if(tk.answered)return;
  tk.answered=true;
  const q=tk.list[tk.i], ok=(k===q.a);
  talkGrade(q,ok);
  renderTalk();
}
function talkTap(i){
  if(tk.answered)return;
  const p=tk.sel.indexOf(i);
  if(p>=0)tk.sel.splice(p,1); else tk.sel.push(i);
  renderTalk();
}
function talkClear(){ if(!tk.answered){ tk.sel=[]; renderTalk(); } }
function talkFill(){
  if(tk.answered)return;
  const el=document.getElementById('tkin');
  const said=(el?el.value:'').trim();
  if(!said){ toast('答えを書いてね'); return; }
  tk.typed=said;
  const q=tk.list[tk.i];
  const norm=x=>String(x).toLowerCase().replace(/[.,!?]/g,'').replace(/[’]/g,"'").trim();
  const ok=q.ans.some(a=>norm(a)===norm(said));
  tk.answered=true;
  talkGrade(q,ok);
  renderTalk();
}
function talkSubmit(){
  if(tk.answered)return;
  const q=tk.list[tk.i];
  if(!tk.sel.length){ toast('単語をえらんでね'); return; }
  const said=tk.sel.map(i=>q.bank[i]);
  const ok=q.ans.some(a=>talkSame(a,said));
  tk.near=!ok && q.ans.some(a=>talkSameSet(a,said));   // 語は合っているが並びが違う
  tk.answered=true;
  talkGrade(q,ok);
  renderTalk();
}
function talkGrade(q,ok){
  if(!state.tstat)state.tstat={};
  const st=state.tstat[q.id]||{c:0,w:0};
  if(ok){ st.c++; tk.score++; tk.combo++; tk.maxCombo=Math.max(tk.maxCombo,tk.combo);
    if(tk.combo>state.maxCombo)state.maxCombo=tk.combo;
    addXp(14+(tk.combo>=5?10:tk.combo>=3?5:0)); touchStreak(); pop(tk.combo>=3?14:8);
  }else{ st.w++; tk.combo=0; tk.miss.push(q); }
  st.d=dayNum(); state.tstat[q.id]=st;
  state.talkDone=(state.talkDone||0);
  save(); checkAch();
}
/* 単語バンクの表示順。データは読みやすいように答えの順で書いてあるので、
   そのまま出すと左から押すだけで解けてしまう。毎回まぜる。 */
function talkOrder(q){
  if(!q)return [];
  if(q.mode==='build')return shuffle(q.bank.map((_,i)=>i));
  if(q.mode==='pick') return shuffle(q.ch.map((_,i)=>i));
  return [];
}
function talkNext(){
  tk.i++; tk.answered=false; tk.sel=[]; tk.near=false; tk.typed='';
  tk.ord=talkOrder(tk.list[tk.i]);
  renderTalk();
}

      </div>

        <div style="font-size:30px">⚠️</div><div style="font-weight:800">問題を読み込めませんでした</div>
        <p class="help">data フォルダの talk.json が見つかりません。</p></div>`:
      `<div class="modes">

        ${row('e1','やさしい','中1でならう形')}
        ${row('e2','ふつう','中2でならう形')}

function answerQuiz(picked,correctId){

}
function taWord(){ if(ta.i>=ta.pool.length){ta.pool=shuffle(ta.pool);ta.i=0;} return ta.pool[ta.i]; }
function renderTA(){
  const c=taWord();ta.answered=false;

}
function answerTA(picked,correctId){
  if(ta.answered)return;ta.answered=true;bumpQ();
  const c=ta.pool[ta.i],real=state.words.find(x=>x.id===c.id),ok=picked===correctId;
  document.querySelectorAll('.choice').forEach(b=>{const id=b.dataset.id;
    if(id===correctId)b.classList.add('correct');else if(id===picked)b.classList.add('wrong');else b.classList.add('dim');b.onclick=null;});

function showHint(){
  const c=sp.list[sp.i],el=$('spHint'); if(!el)return;
  const en=c.en, letters=en.replace(/ /g,'').length;
  if(sp.hint===1){ el.textContent=en.split('').map(ch=>ch===' '?'·':'_').join(' ')+`  (${letters}文字)`; }
  else if(sp.hint===2){ el.textContent=en.split('').map((ch,i)=>ch===' '?'·':(i===0?ch:'_')).join(' ')+`  (${letters}文字)`; }
  else if(sp.hint>=3){ el.textContent=en.split('').map((ch,i)=>ch===' '?'·':(i===0||i===en.length-1||i%2===0?ch:'_')).join(' '); }
}
function spellHint(){ if(sp.hint<3)sp.hint++; showHint(); }
function checkSpell(){

      if(real){real.correct++; if(real.correct>=3)real.learned=true;mark(real,1);}

  }else{

    fb.innerHTML=`<div style="background:#FFF0F2;border:1.5px solid var(--danger);border-radius:14px;padding:16px;text-align:center">

        <button class="btn btn-ghost" onclick="nextSpell()">次へ ›</button></div>`;

/* マッチング */
let gm={pairs:[],sel:null,done:0,t:0,timer:null,need:0};
function startGame(){
  const list=wordsOf(currentGroup); if(list.length<3){toast('マッチングは3語以上で遊べるよ');return;}
  const pick=shuffle(list).slice(0,Math.min(6,list.length));
  gm={pairs:pick,sel:null,done:0,t:0,timer:null,need:pick.length};
  renderGame();
  clearInterval(gm.timer);
  gm.timer=setInterval(()=>{gm.t++;const el=$('gmTimer');if(el)el.textContent=fmt(gm.t);else clearInterval(gm.timer);},1000);
}
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m>0?m+':':'')+(m>0?String(x).padStart(2,'0'):x)+(m>0?'':'秒');}
function renderGame(){
  const ens=gm.pairs.map(p=>({id:p.id,text:p.en,type:'en'}));
  const jas=gm.pairs.map(p=>({id:p.id,text:p.ja,type:'ja'}));
  const tiles=shuffle(ens.concat(jas));
  screen.innerHTML=`
    <button class="back" onclick="stopGame()">‹ 戻る</button>
    <div class="mode-head"><h2>⚡ マッチング</h2></div>
    <div class="game-top"><span class="left">残り ${gm.need-gm.done} ペア</span><span class="timer" id="gmTimer">${fmt(gm.t)}</span></div>
    <div class="match-grid" id="grid">
      ${tiles.map(t=>`<div class="tile ${t.type}" data-id="${t.id}" data-type="${t.type}" onclick="tapTile(this)">${esc(t.text)}</div>`).join('')}
    </div>`;
}
function tapTile(el){
  if(el.classList.contains('done')||el.classList.contains('sel'))return;
  if(!gm.sel){gm.sel=el;el.classList.add('sel');return;}
  const a=gm.sel,b=el;
  if(a.dataset.type===b.dataset.type){a.classList.remove('sel');gm.sel=b;b.classList.add('sel');return;}
  if(a.dataset.id===b.dataset.id){
    a.classList.add('done');b.classList.add('done');gm.sel=null;gm.done++;pop();
    const left=document.querySelector('.left');if(left)left.textContent=`残り ${gm.need-gm.done} ペア`;
    if(gm.done>=gm.need)finishGame();
  }else{
    b.classList.add('miss');a.classList.add('miss');const a2=a,b2=b;gm.sel=null;
    setTimeout(()=>{a2.classList.remove('miss','sel');b2.classList.remove('miss');},350);
  }
}
function stopGame(){ clearInterval(gm.timer); renderHome(); }
function finishGame(){
  clearInterval(gm.timer);
  addXp(30);touchStreak();
  setTimeout(()=>{ screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ 戻る</button>
    <div class="result"><div class="emoji">⚡</div><div class="big">${fmt(gm.t)}</div><h2>クリア！</h2><p>${gm.need}ペア そろえたよ</p></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      <button class="btn btn-primary" onclick="startGame()">もう一回</button></div>`; },400);
}

/* リスニング */
let ls={list:[],i:0,score:0,miss:[],mode:'choice',answered:false,combo:0,maxCombo:0,revealed:false};
function startLs(){
  const list=wordsOf(currentGroup);
  if(list.length<4){toast('リスニングは4語以上必要です');return;}
  const n=quizCount==='all'?list.length:Math.min(quizCount,list.length);
  markMode('listen');markLevel(curLevel);
  ls={list:shuffle(list).slice(0,n),i:0,score:0,miss:[],mode:ls.mode||'choice',answered:false,combo:0,maxCombo:0,revealed:false};
  renderLs();
}
function lsMode(m){ ls.mode=m; ls.answered=false; ls.revealed=false; renderLs(); }
function renderLs(){
  if(ls.i>=ls.list.length) return renderLsResult();
  const c=ls.list[ls.i];ls.answered=false;ls.revealed=false;
  let body='';
  if(ls.mode==='choice'){
    const others=shuffle(state.words.filter(x=>x.id!==c.id)).slice(0,3);
    const opts=shuffle([c,...others]);
    body=`<div class="choices">${opts.map(x=>`<button class="choice" data-id="${x.id}" onclick="answerLsChoice('${x.id}','${c.id}')">${esc(x.ja)}</button>`).join('')}</div>`;
  }else{
    body=`
      <div class="field" style="margin-bottom:10px"><input id="lsInput" placeholder="聞こえた英語を入力" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkLsDict()"></div>
      <div id="lsHintArea" style="min-height:22px;margin-bottom:10px;font-size:13px;color:var(--sub);font-weight:700;text-align:center"></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" onclick="lsHint()">💡 意味を見る</button>
        <button class="btn btn-primary" onclick="checkLsDict()">こたえる</button>
      </div>`;
  }
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ 戻る</button>
    <div class="mode-head"><h2>👂 リスニング</h2><span class="quiz-score">${ls.combo>=2?`<span class="combo-tag">🔥${ls.combo} </span>`:''}⭐ ${ls.score} (${ls.i+1}/${ls.list.length})</span></div>
    <div class="progress-line"><i style="width:${ls.i/ls.list.length*100}%"></i></div>
    <div class="toggle-row"><div class="seg">
      <button class="${ls.mode==='choice'?'on':''}" onclick="lsMode('choice')">聞いて選ぶ</button>
      <button class="${ls.mode==='dict'?'on':''}" onclick="lsMode('dict')">聞いて書く</button>
    </div></div>
    <div style="height:12px"></div>
    <div class="q-card" style="text-align:center">
      <div class="qlabel">${ls.mode==='choice'?'音声を聞いて意味を選ぶ':'音声を聞いて英語で書く'}</div>
      <button class="btn btn-accent" style="max-width:220px;margin:6px auto 0" onclick="speakLs()">🔊 もう一度聞く</button>
    </div>
    ${body}
    <div id="lsFeedback" style="margin-top:14px"></div>`;
  setTimeout(()=>{speakLs();const el=$('lsInput');if(el)el.focus();},350);
}
function lsHint(){
  const c=ls.list[ls.i];
  $('lsHintArea').textContent='意味: '+c.ja+'　('+c.en.replace(/ /g,'').length+'文字)';
}
function lsCorrect(real){
  ls.score++;ls.combo++;ls.maxCombo=Math.max(ls.maxCombo,ls.combo);
  if(ls.combo>state.maxCombo)state.maxCombo=ls.combo;
  if(real){real.correct++;if(real.correct>=3)real.learned=true;mark(real,1);}
  addXp((ls.mode==='dict'?18:12)+(ls.combo>=5?10:ls.combo>=3?5:0));touchStreak();
  pop(ls.combo>=3?14:8);
}
function lsWrong(c,real){ ls.combo=0; ls.miss.push(c); if(real){real.wrong++;mark(real,0);} }
function answerLsChoice(picked,correctId){
  if(ls.answered)return;ls.answered=true;bumpQ();
  const c=ls.list[ls.i],real=state.words.find(x=>x.id===c.id),ok=picked===correctId;
  document.querySelectorAll('.choice').forEach(b=>{const id=b.dataset.id;
    if(id===correctId)b.classList.add('correct');else if(id===picked)b.classList.add('wrong');else b.classList.add('dim');b.onclick=null;});
  if(ok)lsCorrect(real);else lsWrong(c,real);
  save();
  $('lsFeedback').innerHTML=`<div class="${ok?'':''}" style="text-align:center;font-weight:800;margin-bottom:10px">${ok?'⭕':'❌'} <span style="font-family:Poppins;font-size:22px;color:var(--primary)">${esc(c.en)}</span>　<span style="color:var(--sub)">${esc(c.ja)}</span></div>
    <button class="btn btn-primary" onclick="lsNext()">次へ ›</button>`;
}
function checkLsDict(){
  if(ls.answered)return;
  const c=ls.list[ls.i],val=$('lsInput').value;
  if(!val.trim()){toast('聞こえた英語を入力してください');return;}
  ls.answered=true;bumpQ();
  const ok=norm(val)===norm(c.en),real=state.words.find(x=>x.id===c.id);
  const inp=$('lsInput');if(inp)inp.disabled=true;
  if(ok)lsCorrect(real);else lsWrong(c,real);
  save();
  $('lsFeedback').innerHTML=ok
    ?`<div style="background:var(--success);color:#fff;border-radius:14px;padding:14px;text-align:center;font-weight:800">⭕ 正解！ <span style="font-family:Poppins">${esc(c.en)}</span>（${esc(c.ja)}）</div>
      <button class="btn btn-primary" style="margin-top:12px" onclick="lsNext()">次へ ›</button>`
    :`<div style="background:#FFF0F2;border:1.5px solid var(--danger);border-radius:14px;padding:14px;text-align:center">
        <div style="color:var(--danger);font-weight:800;margin-bottom:4px">❌ おしい！ 正解は…</div>
        <div style="font-family:Poppins;font-size:24px;font-weight:700">${esc(c.en)}</div>
        <div style="font-size:12px;color:var(--sub);font-weight:700;margin-top:4px">${esc(c.ja)}／あなたの答え: ${esc(val)}</div></div>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn btn-ghost" onclick="speakLs()">🔊 もう一度</button>
        <button class="btn btn-primary" onclick="lsNext()">次へ ›</button></div>`;
}
function lsNext(){ ls.i++; renderLs(); }
function renderLsResult(){
  const total=ls.list.length,rate=Math.round(ls.score/total*100),rk=rankOf(rate);
  const bk='ls_'+ls.mode;const isBest=ls.score>(state.best[bk]||0);
  if(isBest){state.best[bk]=ls.score;save();}
  unlock('first');checkAch();
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ 戻る</button>
    <div class="result"><div class="emoji">👂</div>
      <div style="font-family:Poppins;font-size:46px;font-weight:800;color:var(--accent);line-height:1">${rk}</div>
      <div class="big">${ls.score}<span style="font-size:28px;color:var(--sub)">/${total}</span></div>
      <h2>${rate>=80?'耳がいいね！':'くり返せば必ず聞き取れるようになる'}</h2>
      <p>${ls.mode==='dict'?'聞いて書く':'聞いて選ぶ'} ／ 最大 ${ls.maxCombo} コンボ${isBest?' ／ 🏅ベスト更新！':''}</p></div>
    ${ls.miss.length?`<div class="section-label">まちがえた単語</div><div class="miss-list">${ls.miss.map(x=>`<div class="row"><b>${esc(x.en)}</b><span>${esc(x.ja)}</span></div>`).join('')}</div>`:''}
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      <button class="btn btn-primary" onclick="startLs()">もう一回</button></div>`;
}

/* ===== 記録をファイルでやりとりする ===== */
/* ===== 記録の保存をうながす =====
   端末の中だけに記録があるので、ブラウザのデータを消すと消えてしまう。
   しばらく保存していない人にだけ、静かに知らせる。押しつけない。 */
const BK_EVERY=30, BK_SNOOZE=7, BK_MIN_XP=500;
function bkDue(){
  if((state.xp|0)<BK_MIN_XP)return false;          // 失うものが小さいうちは出さない
  const t=dayNum();
  if(state.bkAt==null){ state.bkAt=t; save(); return false; }   // 初回はここから数えはじめる
  if(state.bkSnooze && t<state.bkSnooze)return false;
  return t-state.bkAt>=BK_EVERY;
}
function backupNote(){
  if(!bkDue())return '';
  const d=dayNum()-state.bkAt;
  return `<div class="bknote">
      <p><b>記録を保存しておきませんか</b><br>
      ${d}日ぶんの記録が、この端末の中だけにあります。ブラウザのデータを消すと、いっしょに消えてしまいます。</p>
      <div class="row2">
        <button class="btn btn-primary" style="font-size:12px;padding:9px" onclick="goBackup()">💾 保存する</button>
        <button class="btn btn-ghost" style="font-size:12px;padding:9px" onclick="bkLater()">あとで</button>
      </div>
    </div>`;
}
function goBackup(){ renderManage();mngTab='io';renderMngBody(); }
function bkLater(){ state.bkSnooze=dayNum()+BK_SNOOZE; save(); toast('また'+BK_SNOOZE+'日後にお知らせします'); renderHome(); }
function markBackedUp(){ state.bkAt=dayNum(); state.bkSnooze=0; save(); }

function backupFileName(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return 'wordup-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
}
async function saveToFile(){
  const text=exportAll(), name=backupFileName();
  try{
    if(window.File&&navigator.canShare){
      const f=new File([text],name,{type:'application/json'});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); markBackedUp(); return; }
    }
  }catch(e){ if(e&&e.name==='AbortError')return; }
  try{
    const b=new Blob([text],{type:'application/json;charset=utf-8'});
    const u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },1000);
    markBackedUp();toast('ファイルに保存しました ✓');
  }catch(e){ toast('保存できませんでした。コピーをお使いください'); }
}
function loadFromFile(){
  const i=document.createElement('input');
  i.type='file'; i.accept='application/json,.json,.txt';
  i.onchange=function(){
    const f=i.files&&i.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=function(){
      const el=document.getElementById('allImp');
      if(!el){ toast('読み込む画面をひらいてから選んでください'); return; }
      el.value=String(r.result||'');
      importAll();
    };
    r.onerror=function(){ toast('ファイルを読めませんでした'); };
    r.readAsText(f);
  };
  i.click();
}

function importAll(){
  const raw=($('allImp')||{}).value||'';
  if(!raw.trim()){toast('貼り付けてから読み込んでください');return;}
  let o; try{ o=JSON.parse(raw.trim()); }catch(e){ toast('形式が正しくありません'); return; }
  const d=o&&o.d?o.d:null;
  if(!d){toast('記録が見つかりません');return;}
  if(o.app&&o.app!=='wordup'){toast('WORD UP! の記録ではありません');return;}
  if(!confirm('いまの記録を、貼り付けた内容で置きかえます。よろしいですか？'))return;
  state.xp=d.xp||0; state.maxCombo=d.maxCombo||0;
  state.ach=d.ach||[]; state.cards=d.cards||[]; state.best=d.best||{};
  state.streak=d.streak||{day:'',count:0};
  state.tickets=d.tickets||{earned:0,used:[]};
  if(d.ticketLabel)state.ticketLabel=d.ticketLabel;
  state.progress=d.progress||{};
  state.myGroups=d.myGroups||[];
  if(d.stat)state.stat=d.stat;
  state.daily=d.daily||null;
  if(d.sound!==undefined)state.sound=d.sound;
  state.tstat=d.tstat||{}; state.talkDone=d.talkDone||0;
  if(d.talkMd)state.talkMd=d.talkMd;
  if(d.level)state.level=d.level;
  // 自作の単語とグループを、いま動いているリストにも反映してから保存する
  state.words=state.words.filter(x=>!x.own);
  state.groups=state.groups.filter(g=>g.lv!=='my'||g.id==='my1'||g.id==='my2');
  state.myGroups.forEach(g=>{ if(!state.groups.some(y=>y.id===g.id))state.groups.push(g); });
  (d.myWords||[]).forEach(x=>state.words.push(x));
  save();
  toast('記録を引き継ぎました ✓ 読み込み直します');
  setTimeout(()=>location.replace(location.origin+location.pathname),900);
}
function fbCopy(id){
  const el=$(id); if(!el){toast('コピーできませんでした');return;}
  el.removeAttribute('readonly'); el.select(); el.setSelectionRange(0,999999);
  try{ document.execCommand('copy'); toast('コピーしました ✓'); }
  catch(e){ toast('長押しして手動でコピーしてください'); }
  el.setAttribute('readonly','');
}
function exportMy(){
  const mine=state.words.filter(x=>x.own);
  if(!mine.length)return '（まだ自分で追加した単語はありません）';
  const byG={};
  mine.forEach(x=>{(byG[x.groupId]=byG[x.groupId]||[]).push(x);});
  let out=[];
  Object.keys(byG).forEach(gid=>{
    const g=state.groups.find(y=>y.id===gid);
    out.push('# '+(g?g.name:gid));
    byG[gid].forEach(x=>out.push(x.en+' '+x.ja));
    out.push('');
  });
  return out.join('\n').trim();
}
function copyMy(){
  const t=exportMy();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>{markBackedUp();toast('コピーしました ✓');}).catch(()=>fallbackCopy(t));
  }else fallbackCopy(t);
}
function fallbackCopy(t){ fbCopy('ioText'); }
function downloadMy(){
  try{
    const blob=new Blob([exportMy()],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');
    const d=new Date();
    a.href=URL.createObjectURL(blob);
    a.download='wordup-mywords-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.txt';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
    markBackedUp();toast('ファイルに保存しました ✓');
  }catch(e){ toast('保存できませんでした。コピーをお使いください'); }
}
function importMy(){
  const raw=($('impText')||{}).value||'';
  if(!raw.trim()){toast('貼り付けてから読み込んでください');return;}
  let gid='my1', added=0, skipped=0, madeG=0;
  const has=new Set(state.words.map(x=>x.groupId+'|'+x.en.toLowerCase()));
  raw.split('\n').forEach(line=>{
    line=line.trim(); if(!line)return;
    if(line.startsWith('#')){
      const name=line.slice(1).trim(); if(!name)return;
      let g=state.groups.find(y=>y.name===name);
      if(!g){ g={id:'g_'+Math.random().toString(36).slice(2,8),name,lv:'my'};
        state.groups.push(g); state.myGroups.push(g); madeG++; }
      gid=g.id; return;
    }
    const parts=line.split(/[,\s]+/);
    if(parts.length<2)return;
    const en=parts[0].trim(), ja=parts.slice(1).join(' ').trim();
    if(!en||!ja)return;
    const key=gid+'|'+en.toLowerCase();
    if(has.has(key)){skipped++;return;}
    has.add(key); state.words.push(w(en,ja,gid)); added++;
  });
  save();
  toast(added+'語を追加'+(skipped?'（重複'+skipped+'語をスキップ）':'')+(madeG?' / グループ'+madeG+'個を作成':''));
  renderManage();
}
function addGroup(){
  const name=$('grpName').value.trim();
  if(!name){toast('グループ名を入れてね');return;}
  const ng={id:'g_'+Math.random().toString(36).slice(2,8),name,lv:'my'};state.groups.push(ng);state.myGroups.push(ng); save(); toast('グループを作成しました ✓'); renderManage();
}
function renameGroup(id){
  const g=state.groups.find(x=>x.id===id); if(!g)return;
  const name=prompt('グループ名を変更',g.name);
  if(name&&name.trim()){g.name=name.trim();save();renderManage();}
}
function delGroup(id){
  const cnt=wordsOf(id).length;
  if(!confirm(`「${groupName(id)}」を消す？\n中の${cnt}語も一緒に消えるよ。`))return;
  state.groups=state.groups.filter(g=>g.id!==id);
  state.words=state.words.filter(x=>x.groupId!==id);
  if(currentGroup===id)currentGroup='all';
  save(); renderManage();
}

const APP_VER='20260902a';

/* 更新の確認と適用 */
async function forceUpdate(){
  try{
    // Service Worker とキャッシュを破棄してから読み直す
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister()));
    }
    if(window.caches){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace(location.origin+location.pathname+'?v='+Date.now());
}
async function checkUpdate(silent){
  try{
    // Service Worker を迂回して直接取りに行く
    const r=await fetch(location.origin+location.pathname+'?c='+Date.now(),{cache:'no-store'});
    const t=await r.text();
    const m=t.match(/const APP_VER='([^']+)'/);
    if(m&&m[1]!==APP_VER){
      const bar=document.getElementById('updBar');
      if(bar){bar.style.display='flex';bar.querySelector('b').textContent='新しいバージョン '+m[1]+' があります';}
      return true;
    }
    if(!silent)toast('最新版です（'+APP_VER+'）');
    return false;
  }catch(e){ if(!silent)toast('確認できませんでした'); return false; }
}

/* Service Worker の登録（オフライン対応） */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
